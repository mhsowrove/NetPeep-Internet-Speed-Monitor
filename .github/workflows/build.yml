name: Desktop builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build small native Windows app
        shell: powershell
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (Test-Path $compiler) { .\native\build.ps1 -InnoCompiler $compiler } else { .\native\build.ps1 }
          $check = Start-Process .\release\native-windows\NetPeep.exe -ArgumentList '--selftest selftest.txt' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Native selftest failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: NetPeep-Windows-x64
          path: |
            release/native-windows/
            ../NetPeep-2.0.0-Windows-x64-Portable.zip
            ../NetPeep-2.0.0-Windows-x64-Setup.exe
  macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build macOS DMG and ZIP (ad-hoc signed, not notarized)
        run: npm run dist:mac:dev -- ${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: NetPeep-macOS-${{ matrix.arch }}-development
          path: release/macos/*
